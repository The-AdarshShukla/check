<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UPI QR Scanner · Smart Name</title>
  <!-- Font Awesome 6 (Free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Swiper CSS (for promo, optional) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
  <!-- Html5Qrcode library -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
    }
    body {
      background: #f5f7fb;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }
    .app-container {
      max-width: 420px;
      width: 100%;
      background: white;
      border-radius: 36px 36px 28px 28px;
      box-shadow: 0 20px 40px rgba(0, 20, 30, 0.12);
      padding: 20px 18px 30px;
      position: relative;
      transition: all 0.2s;
      margin: 0 auto;
    }
    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      padding: 0 4px;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 700;
      color: #0b1a33;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .header h1 i {
      color: #2a7de1;
      font-size: 22px;
    }
    .header .scan-btn {
      background: #1a5bbf;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 14px rgba(26, 91, 191, 0.3);
      transition: 0.2s;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .header .scan-btn:active { transform: scale(0.94); }
    .header .scan-btn i { font-size: 16px; }

    /* result card */
    .result-card {
      background: #ffffff;
      border-radius: 28px;
      padding: 20px 16px;
      margin: 18px 0 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.03), 0 2px 6px rgba(0,20,40,0.04);
      border: 1px solid #eef2f8;
      transition: 0.2s;
    }
    .result-card .label {
      font-size: 13px;
      font-weight: 500;
      color: #6b7a8f;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .result-card .name-value {
      font-size: 26px;
      font-weight: 700;
      color: #0b1a33;
      line-height: 1.2;
      word-break: break-word;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .result-card .name-value i {
      color: #2a7de1;
      font-size: 22px;
      background: #e8effa;
      padding: 6px;
      border-radius: 40px;
    }
    .result-card .upi-sub {
      font-size: 15px;
      color: #4b5a6e;
      background: #f2f5fa;
      padding: 4px 14px;
      border-radius: 60px;
      display: inline-block;
      margin-top: 8px;
      font-weight: 500;
      letter-spacing: 0.2px;
    }
    .result-card .verified-badge {
      background: #e7f3e8;
      color: #1f7b4d;
      font-size: 13px;
      padding: 4px 14px;
      border-radius: 60px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      margin-left: 4px;
    }

    .empty-state {
      color: #8b9bb0;
      text-align: center;
      padding: 18px 0 8px;
      font-weight: 500;
    }
    .empty-state i {
      font-size: 40px;
      color: #cdd9e9;
      margin-bottom: 10px;
      display: block;
    }

    /* manual entry */
    .manual-section {
      background: #f8faff;
      border-radius: 40px;
      padding: 14px 12px;
      margin: 16px 0 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid #e6ecf5;
    }
    .manual-section input {
      flex: 1;
      border: none;
      background: transparent;
      padding: 12px 6px;
      font-size: 16px;
      outline: none;
      font-weight: 500;
      color: #0f1e38;
    }
    .manual-section input::placeholder {
      color: #a6b7cd;
      font-weight: 400;
    }
    .manual-section button {
      background: #1a5bbf;
      border: none;
      color: white;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 40px;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: 0.15s;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .manual-section button:active { background: #1246a0; transform: scale(0.96); }

    /* QR modal overlay */
    .qr-modal {
      position: fixed;
      inset: 0;
      background: rgba(10, 20, 40, 0.75);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 16px;
      animation: fadeIn 0.2s ease;
    }
    .qr-modal.active { display: flex; }
    .qr-modal .modal-box {
      background: white;
      border-radius: 48px;
      max-width: 400px;
      width: 100%;
      padding: 22px 18px 28px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.3);
      position: relative;
    }
    .qr-modal .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .qr-modal .modal-header h3 {
      font-size: 20px;
      font-weight: 700;
      color: #0b1a33;
    }
    .qr-modal .modal-header button {
      background: none;
      border: none;
      font-size: 26px;
      color: #5d6f88;
      cursor: pointer;
      padding: 0 8px;
    }
    #qr-reader {
      width: 100%;
      border-radius: 32px;
      overflow: hidden;
      background: #1e2a3a;
      min-height: 240px;
    }
    .qr-status {
      background: #f0f4fe;
      padding: 12px 14px;
      border-radius: 40px;
      margin-top: 16px;
      text-align: center;
      font-weight: 500;
      color: #1f334d;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 15px;
    }
    .qr-status.success { background: #e2f0e6; color: #146b3a; }
    .qr-status.error { background: #ffe7e7; color: #b33a3a; }
    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid #ccd9ed;
      border-top-color: #1a5bbf;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity:0; transform: scale(0.97); } to { opacity:1; transform: scale(1); } }

    /* Swiper promo (optional) */
    .promo-swiper {
      margin: 18px 0 6px;
      border-radius: 28px;
      overflow: hidden;
    }
    .swiper-slide {
      background: #eef3fd;
      padding: 12px 16px;
      border-radius: 28px;
      text-align: center;
      font-weight: 500;
      color: #17345c;
    }

    /* responsive */
    @media (max-width: 460px) {
      .app-container { padding: 14px 12px 24px; }
      .header h1 { font-size: 18px; }
      .header .scan-btn { padding: 8px 14px; font-size: 14px; }
      .result-card .name-value { font-size: 22px; }
    }
  </style>
</head>
<body>
<div class="app-container">

  <!-- header -->
  <div class="header">
    <h1><i class="fas fa-qrcode"></i> UPI Scan</h1>
    <button class="scan-btn" id="scanTriggerBtn"><i class="fas fa-camera"></i> Scan</button>
  </div>

  <!-- result display -->
  <div class="result-card" id="resultCard">
    <div class="label"><i class="fas fa-user-circle"></i> Payee / Business</div>
    <div id="displayNameWrapper">
      <div class="empty-state" id="emptyState">
        <i class="fas fa-hand-holding-heart"></i>
        <span>Scan any UPI QR to see real name</span>
      </div>
      <div id="filledState" style="display: none;">
        <div class="name-value">
          <i class="fas fa-store-alt"></i>
          <span id="payeeNameDisplay">—</span>
        </div>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 6px;">
          <span class="upi-sub" id="upiIdDisplay">upi@pay</span>
          <span class="verified-badge"><i class="fas fa-check-circle"></i> UPI verified</span>
        </div>
      </div>
    </div>
  </div>

  <!-- manual entry -->
  <div class="manual-section">
    <i class="fas fa-pen" style="color:#4b6b92;"></i>
    <input type="text" id="manualInput" placeholder="Enter UPI or name manually" autocomplete="off">
    <button id="manualSubmitBtn"><i class="fas fa-arrow-right"></i> Set</button>
  </div>

  <!-- optional promo swipe -->
  <div class="promo-swiper swiper mainPromoSwiper">
    <div class="swiper-wrapper">
      <div class="swiper-slide"><i class="fas fa-bolt" style="margin-right:8px;"></i> Scan & see real merchant name</div>
      <div class="swiper-slide"><i class="fas fa-check-double"></i> Works with Paytm, GPay, PhonePe</div>
      <div class="swiper-slide"><i class="fas fa-shield-alt"></i> No data stored</div>
    </div>
    <div class="swiper-pagination"></div>
  </div>

  <!-- QR Modal -->
  <div class="qr-modal" id="qrModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3><i class="fas fa-qrcode" style="color:#1a5bbf;"></i> Scan QR</h3>
        <button id="closeModalBtn">&times;</button>
      </div>
      <div id="qr-reader"></div>
      <div id="qr-status" class="qr-status"><span class="spinner"></span> Initializing camera...</div>
    </div>
  </div>
</div>

<!-- Swiper JS -->
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<script>
  (function() {
    "use strict";

    // DOM refs
    const scanTrigger = document.getElementById('scanTriggerBtn');
    const modal = document.getElementById('qrModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const qrStatus = document.getElementById('qr-status');
    const readerElement = document.getElementById('qr-reader');

    const payeeNameDisplay = document.getElementById('payeeNameDisplay');
    const upiIdDisplay = document.getElementById('upiIdDisplay');
    const emptyState = document.getElementById('emptyState');
    const filledState = document.getElementById('filledState');

    const manualInput = document.getElementById('manualInput');
    const manualSubmitBtn = document.getElementById('manualSubmitBtn');

    let html5QrCode = null;
    let isScanning = false;

    // ---------- UPDATE UI with extracted name ----------
    function updateDisplay(name, upi) {
      if (!name || name.trim() === '') name = 'Unknown User';
      if (!upi || upi.trim() === '') upi = 'user@upi';

      // clean
      name = name.trim().replace(/\s+/g, ' ');
      upi = upi.trim();

      // Capitalize each word
      name = name.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');

      payeeNameDisplay.innerText = name;
      upiIdDisplay.innerText = upi;

      emptyState.style.display = 'none';
      filledState.style.display = 'block';
    }

    // ---------- EXTRACTOR: real name from any QR ----------
    function extractRealNameAndUpi(decodedText) {
      console.log('🔍 Raw QR:', decodedText);
      let name = '';
      let upi = '';

      // ----- 1) UPI URL (upi://pay?pa=...&pn=...) -----
      if (decodedText.includes('upi://')) {
        try {
          const url = new URL(decodedText);
          const params = new URLSearchParams(url.search);
          name = params.get('pn') || '';
          if (name) name = decodeURIComponent(name);
          upi = params.get('pa') || '';
        } catch (e) { /* ignore */ }
      }

      // ----- 2) JSON structure -----
      if (!name || !upi) {
        try {
          const json = JSON.parse(decodedText);
          name = json.payeeName || json.name || json.displayName || json.payee || json.merchantName || '';
          upi = json.upi || json.upiId || json.vpa || json.payeeAddress || json.account || '';
        } catch (e) { /* not json */ }
      }

      // ----- 3) UPI pattern (like xxx@yyy) and derive name from prefix -----
      if (!upi) {
        const upiMatch = decodedText.match(/([a-zA-Z0-9._-]+@[a-zA-Z0-9._-]+)/);
        if (upiMatch) {
          upi = upiMatch[1];
          // derive name from upi prefix (remove digits, capitalize)
          let rawName = upi.split('@')[0] || '';
          rawName = rawName.replace(/[0-9._-]/g, ' ').trim();
          if (rawName.length > 1) {
            name = rawName.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
          }
        }
      }

      // ----- 4) search for name patterns in text (Name:, payee:, etc) -----
      if (!name) {
        const patterns = [
          /(?:^|\s)name[\s:]+([a-zA-Z\s]{2,40})/i,
          /(?:^|\s)payee[\s:]+([a-zA-Z\s]{2,40})/i,
          /(?:^|\s)merchant[\s:]+([a-zA-Z\s]{2,40})/i,
          /(?:^|\s)business[\s:]+([a-zA-Z\s]{2,40})/i,
          /(?:^|\s)recipient[\s:]+([a-zA-Z\s]{2,40})/i,
        ];
        for (let p of patterns) {
          const m = decodedText.match(p);
          if (m) { name = m[1].trim(); break; }
        }
      }

      // ----- 5) fallback: use first few words from cleaned text -----
      if (!name) {
        let clean = decodedText.replace(/[^a-zA-Z\s]/g, ' ').trim();
        const words = clean.split(/\s+/).filter(w => w.length > 1);
        if (words.length > 0) {
          name = words.slice(0, 3).join(' ');
          if (name.length > 35) name = name.substring(0, 35);
        }
      }

      // final fallback
      if (!name || name.length < 1) name = 'UPI User';
      if (!upi || upi.length < 3) {
        // generate a dummy upi from name
        const base = name.replace(/\s+/g, '').toLowerCase().substring(0, 8) || 'user';
        const providers = ['@paytm', '@googlepay', '@phonepe', '@upi', '@amazonpay'];
        upi = base + providers[Math.floor(Math.random() * providers.length)];
      }

      // Capitalize name properly
      name = name.replace(/\s+/g, ' ').trim();
      name = name.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');

      return { name, upi };
    }

    // ---------- store and update ----------
    function applyScannedData(decodedText) {
      const { name, upi } = extractRealNameAndUpi(decodedText);
      updateDisplay(name, upi);
      // store in localStorage for send page if needed
      try {
        localStorage.setItem('qrScanData', JSON.stringify({ name, upi, raw: decodedText, timestamp: new Date().toISOString() }));
      } catch (e) {}
      console.log('✅ Extracted -> Name:', name, 'UPI:', upi);
    }

    // ---------- QR scan success ----------
    function onScanSuccess(decodedText) {
      if (html5QrCode && isScanning) {
        html5QrCode.stop().then(() => { isScanning = false; }).catch(e => console.warn(e));
      }
      qrStatus.className = 'qr-status success';
      qrStatus.innerHTML = '✅ QR detected!';

      applyScannedData(decodedText);

      setTimeout(() => {
        closeModal();
      }, 400);
    }

    function onScanError(err) { /* ignore frequent */ }

    // ---------- Modal control ----------
    function openModal() {
      modal.classList.add('active');
      qrStatus.className = 'qr-status';
      qrStatus.innerHTML = '<span class="spinner"></span> Starting camera...';

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        qrStatus.className = 'qr-status error';
        qrStatus.innerHTML = '❌ Camera not supported';
        return;
      }

      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("qr-reader");
      }

      const config = { fps: 10, qrbox: { width: 240, height: 240 }, aspectRatio: 1.0 };
      html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess, onScanError)
        .then(() => {
          isScanning = true;
          qrStatus.className = 'qr-status';
          qrStatus.innerHTML = '📷 Point camera at QR code';
        })
        .catch((err) => {
          qrStatus.className = 'qr-status error';
          qrStatus.innerHTML = '❌ Camera access denied. Please allow permissions.';
          console.error(err);
        });
    }

    function closeModal() {
      modal.classList.remove('active');
      if (html5QrCode && isScanning) {
        html5QrCode.stop().then(() => { isScanning = false; }).catch(e => console.warn(e));
      }
    }

    // ---------- manual entry handler ----------
    function handleManual() {
      const val = manualInput.value.trim();
      if (!val) {
        alert('Please enter a UPI ID or business name');
        return;
      }
      // if it looks like upi (contains @) then use as upi, else treat as name
      let name = '';
      let upi = '';
      if (val.includes('@')) {
        upi = val;
        const prefix = val.split('@')[0] || '';
        name = prefix.replace(/[0-9._-]/g, ' ').trim();
        if (!name) name = prefix || 'User';
        name = name.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
      } else {
        name = val;
        // generate a dummy upi
        const base = name.replace(/\s+/g, '').toLowerCase().substring(0, 8) || 'user';
        const providers = ['@paytm', '@googlepay', '@phonepe', '@upi', '@amazonpay'];
        upi = base + providers[Math.floor(Math.random() * providers.length)];
      }
      updateDisplay(name, upi);
      try {
        localStorage.setItem('qrScanData', JSON.stringify({ name, upi, raw: val, timestamp: new Date().toISOString() }));
      } catch (e) {}
      manualInput.value = '';
    }

    // ---------- event listeners ----------
    scanTrigger.addEventListener('click', openModal);
    closeModalBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

    manualSubmitBtn.addEventListener('click', handleManual);
    manualInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleManual(); });

    // ---------- check if scanned data exists on load (optional) ----------
    try {
      const stored = localStorage.getItem('qrScanData');
      if (stored) {
        const parsed = JSON.parse(stored);
        if (parsed && parsed.name) {
          updateDisplay(parsed.name, parsed.upi || 'upi@pay');
        }
      }
    } catch (e) {}

    // ---------- Swiper promo ----------
    if (typeof Swiper !== 'undefined') {
      new Swiper(".mainPromoSwiper", {
        loop: true,
        autoplay: { delay: 3000, disableOnInteraction: false },
        pagination: { el: ".swiper-pagination", clickable: true },
      });
    }

    // ---------- (optional) close modal if scanning stops ----------
    console.log('🔵 UPI QR scanner ready — real name extractor active');
  })();
</script>
</body>
</html>
