<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPI QR Scanner - Actual Name Reader</title>
    <!-- Tailwind CSS for Responsive Design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Html5-Qrcode Library -->
    <script src="https://unpkg.F/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body class="bg-slate-100 font-sans min-f-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden p-6">
        <!-- Header -->
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl shadow-inner">
                <i class="fa-solid fa-qrcode"></i>
            </div>
            <h1 class="text-xl font-bold text-slate-800">UPI QR Name Scanner</h1>
            <p class="text-xs text-slate-500 mt-1">Scan any UPI QR to get the Actual Name & UPI ID</p>
        </div>

        <!-- Scanner Box -->
        <div class="relative bg-black rounded-2xl overflow-hidden shadow-inner mb-6 flex items-center justify-center" style="min-height: 280px;">
            <div id="qr-reader" class="w-full"></div>
            <!-- Scanner Overlay Guide -->
            <div id="scanner-placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-white/70 p-4 pointer-events-none">
                <i class="fa-solid fa-camera text-4xl mb-2 animate-pulse"></i>
                <p class="text-sm">Camera is inactive</p>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex gap-3 mb-6">
            <button onclick="startScanner()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-3 px-4 rounded-xl font-semibold shadow-md transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-play"></i> Start Scan
            </button>
            <button onclick="stopScanner()" class="flex-1 bg-rose-500 hover:bg-rose-600 text-white py-3 px-4 rounded-xl font-semibold shadow-md transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-stop"></i> Stop
            </button>
        </div>

        <!-- Result Box -->
        <div id="result-box" class="hidden bg-slate-50 border border-slate-200 rounded-2xl p-4 shadow-sm">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 flex items-center gap-1.5">
                <i class="fa-solid fa-circle-check text-emerald-500"></i> Scanned Details
            </h2>
            
            <div class="space-y-2 text-sm">
                <div class="flex justify-between border-b border-slate-200 pb-2">
                    <span class="text-slate-500 font-medium">Actual Name:</span>
                    <span id="res-name" class="font-bold text-slate-800 text-right">-</span>
                </div>
                <div class="flex justify-between border-b border-slate-200 pb-2">
                    <span class="text-slate-500 font-medium">UPI ID / VPA:</span>
                    <span id="res-upi" class="font-semibold text-indigo-600 text-right">-</span>
                </div>
                <div class="flex flex-col pt-1">
                    <span class="text-slate-500 font-medium text-xs mb-1">Raw QR Data:</span>
                    <span id="res-raw" class="bg-slate-200/60 p-2 rounded-lg text-xs text-slate-600 break-all font-mono">-</span>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        let html5QrCode = null;
        let isScanning = false;

        function startScanner() {
            const placeholder = document.getElementById('scanner-placeholder');
            
            if (isScanning) return;

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("qr-reader");
            }

            const config = { fps: 10, qrbox: { width: 230, height: 230 } };

            html5QrCode.start(
                { facingMode: "environment" }, 
                config, 
                onScanSuccess, 
                onScanError
            ).then(() => {
                isScanning = true;
                placeholder.style.display = 'none';
            }).catch(err => {
                alert("Camera Access Denied or Not Supported! Please allow camera permissions.");
                console.error("Scanner Error: ", err);
            });
        }

        function stopScanner() {
            if (html5QrCode && isScanning) {
                html5QrCode.stop().then(() => {
                    isScanning = false;
                    document.getElementById('scanner-placeholder').style.display = 'flex';
                }).catch(err => console.error("Stop error: ", err));
            }
        }

        function onScanSuccess(decodedText, decodedResult) {
            // Scan hote hi scanner rok dein
            stopScanner();
            
            // Data Parse Karein
            const parsedData = parseUPIQRCode(decodedText);

            // UI par Data Show Karein
            document.getElementById('res-name').innerText = parsedData.name;
            document.getElementById('res-upi').innerText = parsedData.upi;
            document.getElementById('res-raw').innerText = decodedText;
            
            document.getElementById('result-box').classList.remove('hidden');
        }

        function onScanError(errorMessage) {
            // Frame scanning errors ignore kiye jate hain jab tak QR na mile
        }

        // UPI QR String se Name aur UPI ID extract karne ka core function
        function parseUPIQRCode(text) {
            let name = "Unknown / Not Found";
            let upi = "Not Available";

            // 1. Check if it's a standard UPI URL format (upi://pay?...)
            if (text.includes('upi://')) {
                try {
                    const upiIndex = text.indexOf('upi://');
                    const cleanUrl = text.substring(upiIndex);
                    const url = new URL(cleanUrl);
                    const params = new URLSearchParams(url.search);

                    // 'pn' parameter = Payee Name (Actual Name)
                    if (params.has('pn')) {
                        name = decodeURIComponent(params.get('pn'));
                    }
                    // 'pa' parameter = Payee Address (UPI ID)
                    if (params.has('pa')) {
                        upi = params.get('pa');
                    }
                } catch (e) {
                    console.error("URL Parsing error:", e);
                }
            } 
            
            // 2. Fallback: Agar URL format na ho lekin UPI ID ho
            if (upi === "Not Available") {
                const upiRegex = /([a-zA-Z0-9._-]+@[a-zA-Z0-9._-]+)/;
                const match = text.match(upiRegex);
                if (match) {
                    upi = match[1];
                    if (name === "Unknown / Not Found") {
                        let namePart = upi.split('@')[0];
                        name = namePart.replace(/[0-9]/g, ' ').trim();
                        name = name.charAt(0).toUpperCase() + name.slice(1);
                    }
                }
            }

            return { name, upi };
        }
    </script>
</body>
</html>
