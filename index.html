<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced UPI QR Scanner</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Html5-Qrcode Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js" integrity="sha512-r6rDA7W6ZeQhvl8S7yRVQUKVHdexqpHvgxvNk4Rs7QHkGnkUBAku/UKLqZUQjv1TusPj51XZ48MA7GFK78Fg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body class="bg-slate-100 font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden p-6">
        <!-- Header -->
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl shadow-inner">
                <i class="fa-solid fa-qrcode"></i>
            </div>
            <h1 class="text-xl font-bold text-slate-800">UPI QR Name Scanner</h1>
            <p class="text-xs text-slate-500 mt-1">Scan any UPI QR to get Actual Name & VPA</p>
        </div>

        <!-- Scanner Viewport -->
        <div class="relative bg-slate-900 rounded-2xl overflow-hidden shadow-inner mb-4 flex items-center justify-center" style="min-height: 280px;">
            <div id="qr-reader" class="w-full"></div>
            <!-- Placeholder -->
            <div id="scanner-placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-white/70 p-4 pointer-events-none z-10 bg-slate-900">
                <i class="fa-solid fa-camera text-4xl mb-2 animate-bounce"></i>
                <p class="text-sm font-medium">Click Start Camera Below</p>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex gap-3 mb-4">
            <button onclick="startScanner()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-3 px-4 rounded-xl font-semibold shadow-md transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-play"></i> Start Camera
            </button>
            <button onclick="stopScanner()" class="flex-1 bg-rose-500 hover:bg-rose-600 text-white py-3 px-4 rounded-xl font-semibold shadow-md transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-stop"></i> Stop
            </button>
        </div>

        <!-- Alternative: Upload QR Image from Gallery -->
        <div class="mb-6">
            <label class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 py-2.5 px-4 rounded-xl font-medium text-sm flex items-center justify-center gap-2 cursor-pointer transition-all">
                <i class="fa-solid fa-image text-indigo-600"></i> Upload QR from Gallery
                <input type="file" id="qr-file-input" accept="image/*" class="hidden" onchange="scanImageFromFile(event)">
            </label>
        </div>

        <!-- Result Box -->
        <div id="result-box" class="hidden bg-slate-50 border border-slate-200 rounded-2xl p-4 shadow-sm">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 flex items-center gap-1.5">
                <i class="fa-solid fa-circle-check text-emerald-500"></i> Scanned Details
            </h2>
            
            <div class="space-y-2 text-sm">
                <div class="flex justify-between border-b border-slate-200 pb-2">
                    <span class="text-slate-500 font-medium">Actual Name:</span>
                    <span id="res-name" class="font-bold text-slate-800 text-right">-</span>
                </div>
                <div class="flex justify-between border-b border-slate-200 pb-2">
                    <span class="text-slate-500 font-medium">UPI ID / VPA:</span>
                    <span id="res-upi" class="font-semibold text-indigo-600 text-right">-</span>
                </div>
                <div class="flex flex-col pt-1">
                    <span class="text-slate-500 font-medium text-xs mb-1">Raw Data:</span>
                    <span id="res-raw" class="bg-slate-200/60 p-2 rounded-lg text-xs text-slate-600 break-all font-mono">-</span>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Script -->
    <script>
        let html5QrCode = null;
        let isScanning = false;

        function startScanner() {
            const placeholder = document.getElementById('scanner-placeholder');
            
            if (isScanning) return;

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("qr-reader");
            }

            const config = { fps: 10, qrbox: { width: 230, height: 230 } };

            html5QrCode.start(
                { facingMode: "environment" }, 
                config, 
                onScanSuccess, 
                onScanError
            ).then(() => {
                isScanning = true;
                placeholder.style.display = 'none';
            }).catch(err => {
                alert("Camera Error: Please make sure you are using HTTPS or Localhost, and camera permission is allowed.");
                console.error("Scanner Error: ", err);
            });
        }

        function stopScanner() {
            if (html5QrCode && isScanning) {
                html5QrCode.stop().then(() => {
                    isScanning = false;
                    document.getElementById('scanner-placeholder').style.display = 'flex';
                }).catch(err => console.error("Stop error: ", err));
            }
        }

        function onScanSuccess(decodedText, decodedResult) {
            stopScanner();
            displayResults(decodedText);
        }

        function onScanError(errorMessage) {
            // Background scanning errors can be ignored
        }

        // Gallery Image Scanner
        function scanImageFromFile(e) {
            if (e.target.files.length == 0) return;
            const imageFile = e.target.files[0];
            
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("qr-reader");
            }

            html5QrCode.scanFile(imageFile, true)
                .then(decodedText => {
                    displayResults(decodedText);
                })
                .catch(err => {
                    alert("Could not read QR code from this image. Please try another clear screenshot.");
                    console.error("File scan error:", err);
                });
        }

        // Parse UPI Data and Display
        function displayResults(decodedText) {
            let name = "Unknown / Not Found";
            let upi = "Not Available";

            // Clean check for UPI string
            if (decodedText.includes('upi://')) {
                try {
                    // Extract parameters safely using URLSearchParams
                    const urlParams = decodedText.split('?')[1];
                    if (urlParams) {
                        const params = new URLSearchParams(urlParams);
                        if (params.has('pn')) {
                            name = decodeURIComponent(params.get('pn').replace(/\+/g, ' '));
                        }
                        if (params.has('pa')) {
                            upi = params.get('pa');
                        }
                    }
                } catch (e) {
                    console.error("Parsing error:", e);
                }
            } 
            
            // Fallback if standard parameters are missing
            if (upi === "Not Available") {
                const upiRegex = /([a-zA-Z0-9._-]+@[a-zA-Z0-9._-]+)/;
                const match = decodedText.match(upiRegex);
                if (match) {
                    upi = match[1];
                }
            }

            document.getElementById('res-name').innerText = name;
            document.getElementById('res-upi').innerText = upi;
            document.getElementById('res-raw').innerText = decodedText;
            document.getElementById('result-box').classList.remove('hidden');
        }
    </script>
</body>
</html>
